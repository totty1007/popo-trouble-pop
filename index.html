<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>トラブル対応POP印刷</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header no-print">
    <h1>トラブル対応POP印刷</h1>
    <p class="sub">店舗とフォーマットを選び、必要な項目を入力すると、その場でPOPを作成して印刷できます。</p>
  </header>

  <main class="layout">
    <section class="panel controls no-print">
      <div class="control-group">
        <label for="areaSelect">① エリアで絞り込み（任意）</label>
        <select id="areaSelect"></select>
      </div>

      <div class="control-group">
        <label for="storeSelect">② 店舗を選択</label>
        <select id="storeSelect"></select>
      </div>

      <div class="control-group">
        <label for="formatSelect">③ フォーマットを選択</label>
        <select id="formatSelect"></select>
      </div>

      <div class="control-group" id="fieldsContainer">
        <p class="hint">フォーマットを選択すると、入力項目がここに表示されます。</p>
      </div>

      <div class="control-group paper-controls">
        <div>
          <label for="orientation">向き（用紙はA4固定）</label>
          <select id="orientation">
            <option value="portrait">縦</option>
            <option value="landscape">横</option>
          </select>
        </div>
        <div>
          <label for="designSelect">デザイン</label>
          <select id="designSelect">
            <option value="A">A（トマト・パスタ柄）</option>
            <option value="B">B（ワイン・チーズ柄）</option>
          </select>
        </div>
      </div>

      <div class="control-group">
        <label for="logoSelect">ロゴ（POP下部に表示）</label>
        <select id="logoSelect"></select>
      </div>

      <button id="printBtn" class="btn-primary" disabled>🖨 印刷する</button>
      <p id="printHint" class="print-hint"></p>
    </section>

    <section class="panel preview-wrap">
      <div id="previewPage" class="preview-page a4-fixed portrait">
        <div id="previewHeading" class="preview-heading"></div>
        <div id="previewBody" class="preview-body">
          <div id="previewBodyText" class="preview-body-text"></div>
        </div>
        <div id="previewLogoBadge" class="preview-logo-badge">
          <img id="previewLogoImg" src="" alt="" />
        </div>
      </div>
    </section>
  </main>

  <script src="formats.js"></script>
  <script src="app.js"></script>
</body>
</html>
